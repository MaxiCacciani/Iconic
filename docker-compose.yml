# Servicios: db, api (web y datos se suman con el frontend y los datos de ejemplo).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: iconic
      POSTGRES_USER: iconic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iconic}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/sql/catalogos.sql:/docker-entrypoint-initdb.d/02-catalogos.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iconic -d iconic"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      ENTORNO: docker
      DATABASE_URL: postgresql+psycopg://iconic:${POSTGRES_PASSWORD:-iconic}@db:5432/iconic
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
